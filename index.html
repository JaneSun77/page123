<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="page123 - 静态网页项目" />
  <title>page123</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <div class="nav__logo">page123</div>
      <ul class="nav__links">
        <li><a href="#home">首页</a></li>
        <li><a href="#about">关于</a></li>
        <li><a href="#contact">联系</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="home" class="hero">
      <div class="hero__content">
        <h1 class="hero__title">欢迎来到 page123</h1>
        <p class="hero__subtitle">这是一个简洁的静态网页项目</p>
        <a href="#about" class="btn btn--primary">了解更多</a>
      </div>
    </section>

    <section id="about" class="section">
      <div class="container">
        <h2 class="section__title">关于</h2>
        <p class="section__text">这里是关于页面的内容区域，你可以在此介绍项目或个人信息。</p>
        <div class="cards">
          <div class="card">
            <h3 class="card__title">特性一</h3>
            <p class="card__text">简洁、轻量，无需构建工具即可运行。</p>
          </div>
          <div class="card">
            <h3 class="card__title">特性二</h3>
            <p class="card__text">响应式设计，适配桌面与移动端。</p>
          </div>
          <div class="card">
            <h3 class="card__title">特性三</h3>
            <p class="card__text">易于扩展，按需添加功能与样式。</p>
          </div>
        </div>
      </div>
    </section>

    <section id="contact" class="section section--alt">
      <div class="container">
        <h2 class="section__title">联系</h2>
        <form class="contact-form" id="contactForm" novalidate>
          <div class="form-group">
            <label for="name">姓名</label>
            <input type="text" id="name" name="name" placeholder="请输入姓名" required />
          </div>
          <div class="form-group">
            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" placeholder="请输入邮箱" required />
          </div>
          <div class="form-group">
            <label for="message">留言</label>
            <textarea id="message" name="message" rows="4" placeholder="请输入留言内容" required></textarea>
          </div>
          <button type="submit" class="btn btn--primary">发送</button>
          <p class="form-feedback" id="formFeedback" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> page123. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
